name: Pilot Linux package and manifest acceptance

on:
  push:
    paths:
      - "server/go.mod"
      - "server/go.sum"
      - "server/internal/pilotcontrol/**"
      - "server/internal/pilotsupervisor/**"
      - "server/third_party/go-sqlite3/**"
      - "docs/4*-*"
      - "docs/5*-*"
      - "docs/6*-*"
      - "docs/7*-*"
      - "review/run_pilot_vfs_candidate.py"
      - "review/test_pilot_vfs_candidate_runner.py"
      - "review/verify_pilot_draft_schema_gate.py"
      - "review/test_pilot_draft_schema_gate.py"
      - "review/pilot_ext4_fixture.py"
      - "review/test_pilot_ext4_fixture.py"
      - ".github/workflows/pilot-control-cgo.yml"
  pull_request:
    paths:
      - "server/go.mod"
      - "server/go.sum"
      - "server/internal/pilotcontrol/**"
      - "server/internal/pilotsupervisor/**"
      - "server/third_party/go-sqlite3/**"
      - "docs/4*-*"
      - "docs/5*-*"
      - "docs/6*-*"
      - "docs/7*-*"
      - "review/run_pilot_vfs_candidate.py"
      - "review/test_pilot_vfs_candidate_runner.py"
      - "review/verify_pilot_draft_schema_gate.py"
      - "review/test_pilot_draft_schema_gate.py"
      - "review/pilot_ext4_fixture.py"
      - "review/test_pilot_ext4_fixture.py"
      - ".github/workflows/pilot-control-cgo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-package-regression:
    name: Linux package checks only (not VFS or RunRoot acceptance)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true
          cache-dependency-path: server/go.sum
      - name: Install passive syscall tracer
        run: |
          sudo apt-get update
          sudo apt-get install --yes e2fsprogs strace
      - name: Prepare dedicated ext4 filesystem fixture
        working-directory: .
        run: |
          set -euo pipefail
          fixture_dir="$RUNNER_TEMP/pilot-ext4-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 0700 "$fixture_dir"
          umask 077
          printf 'pilot-ext4-ci\nrun_id=%s\nattempt=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$fixture_dir/.owner"
          image="$fixture_dir/fs.img"
          mountpoint="$fixture_dir/mount"
          test_root="$mountpoint/test-root"
          mkdir -m 0700 "$mountpoint"
          truncate -s 256M "$image"
          mkfs.ext4 -F -q "$image"
          loop_device="$(sudo losetup --find --show "$image")"
          [[ "$loop_device" =~ ^/dev/loop[0-9]+$ ]]
          sudo mount -t ext4 "$loop_device" "$mountpoint"
          test "$(findmnt --noheadings --raw --output TARGET --mountpoint "$mountpoint")" = "$mountpoint"
          test "$(findmnt --noheadings --raw --output FSTYPE --mountpoint "$mountpoint")" = "ext4"
          test "$(findmnt --noheadings --raw --output SOURCE --mountpoint "$mountpoint")" = "$loop_device"
          associated="$(sudo losetup --list --noheadings --raw --output NAME --associated "$image")"
          test "$associated" = "$loop_device"
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "$test_root"
          test -w "$test_root"
          printf 'PILOT_FS_TEST_ROOT=%s\n' "$test_root" >> "$GITHUB_ENV"
      - name: Build Linux RunRoot supervisor for amd64 and arm64
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -tags=pilot_e2e ./internal/pilotsupervisor
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -tags=pilot_e2e ./internal/pilotsupervisor
      - name: Test pilot control package
        run: go test ./internal/pilotcontrol -count=1
      - name: Test Linux RunRoot supervisor contracts
        run: go test -tags=pilot_e2e ./internal/pilotsupervisor -count=1
      - name: Race-check pilot control and verify explicit draft skips
        run: |
          set -o pipefail
          go test -json -race ./internal/pilotcontrol -count=1 | tee "$RUNNER_TEMP/pilotcontrol-race.jsonl"
          python3 ../review/verify_pilot_draft_schema_gate.py "$RUNNER_TEMP/pilotcontrol-race.jsonl"
      - name: Race-check Linux RunRoot supervisor
        run: go test -race -tags=pilot_e2e ./internal/pilotsupervisor -count=1
      - name: Vet pilot control package
        run: go vet ./internal/pilotcontrol
      - name: Vet Linux RunRoot supervisor
        run: go vet -tags=pilot_e2e ./internal/pilotsupervisor
      - name: Run full backend regression
        run: go test ./...
      - name: Clean dedicated ext4 filesystem fixture
        if: always()
        working-directory: .
        run: python3 review/pilot_ext4_fixture.py cleanup --runner-temp "$RUNNER_TEMP" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Record package-only acceptance scope
        if: always()
        working-directory: .
        run: echo 'PACKAGE_CHECKS_ONLY; VFS_CANDIDATE=NOT_RUN; V3_DRAFT_SCHEMA_FIXTURE=NOT_RUN; PRIVATE_VFS=NOT_ACCEPTED; PRODUCT_RUNROOT=NOT_ACCEPTED' >> "$GITHUB_STEP_SUMMARY"

  linux-manifest-contract:
    name: Linux manifest contract only
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true
          cache-dependency-path: server/go.sum
      - name: Verify manifest inventory (design scenarios remain NOT RUN)
        env:
          PILOT_VFS_MANIFEST_ARTIFACT_DIR: ${{ runner.temp }}/pilot-vfs-manifest-${{ github.run_id }}-${{ github.run_attempt }}
        run: go test -tags=pilot_e2e ./internal/pilotcontrol -run '^(TestPinnedSQLiteRuntimeIdentity|TestPinnedVFSManifestRequiresEEXISTCases|TestPinnedVFSCallbackManifestIntegrityAndNotRunStatus|TestPilotVFSManifestArtifactDirIsolatedFromCandidateDir|TestPilotVFSRecoveryManifestIntegrityAndNotRunStatus)$' -count=1

  linux-runner-preflight:
    name: Linux runner preflight only (candidate remains NOT RUN)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify runner authorization gate without starting candidate
        run: python3 -m unittest review.test_pilot_vfs_candidate_runner review.test_pilot_draft_schema_gate review.test_pilot_ext4_fixture -v
