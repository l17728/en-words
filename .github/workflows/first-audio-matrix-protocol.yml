name: First-audio control protocol checks

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/73-first-audio-matrix-control-protocol-sdd.md"
      - "server/internal/api/first_audio_matrix_harness_test.go"
      - "server/go.mod"
      - "server/go.sum"
      - "server/third_party/go-sqlite3/**"
      - "server/internal/api/**"
      - "server/internal/classroom/**"
      - "server/internal/config/**"
      - "server/internal/scheduler/**"
      - "server/internal/store/**"
      - "review/first_audio_matrix_control.py"
      - "review/test_first_audio_matrix_control.py"
      - "web/src/**"
      - "web/e2e/**"
      - "web/package.json"
      - "web/package-lock.json"
      - "web/playwright*"
      - ".github/workflows/first-audio-matrix-protocol.yml"
  pull_request:
    paths:
      - "docs/73-first-audio-matrix-control-protocol-sdd.md"
      - "server/internal/api/first_audio_matrix_harness_test.go"
      - "server/go.mod"
      - "server/go.sum"
      - "server/third_party/go-sqlite3/**"
      - "server/internal/api/**"
      - "server/internal/classroom/**"
      - "server/internal/config/**"
      - "server/internal/scheduler/**"
      - "server/internal/store/**"
      - "review/first_audio_matrix_control.py"
      - "review/test_first_audio_matrix_control.py"
      - "web/src/**"
      - "web/e2e/**"
      - "web/package.json"
      - "web/package-lock.json"
      - "web/playwright*"
      - ".github/workflows/first-audio-matrix-protocol.yml"

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true
          cache-dependency-path: server/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install browser-runner dependencies
        run: npm ci --prefix web --no-audit --no-fund
      - name: Test parent process boundary helpers
        run: python3 -m unittest discover -s review -p test_first_audio_matrix_control.py -v
      - name: Test JSONL parser, lifecycle, replay, and terminal cleanup
        working-directory: server
        run: go test ./internal/api -run '^TestFirstAudioMatrix' -count=1 -timeout=5m
      - name: Check Go formatting and API package vet
        working-directory: server
        run: |
          unformatted=$(gofmt -l internal/api/first_audio_matrix_*_test.go)
          if [ -n "$unformatted" ]; then
            printf 'gofmt required for:\n%s\n' "$unformatted" >&2
            exit 1
          fi
          go vet ./internal/api
      - name: Verify test-only harness is absent from production binary
        working-directory: server
        run: |
          go build -o "$RUNNER_TEMP/en-words-server" ./cmd/server
          if go tool nm "$RUNNER_TEMP/en-words-server" | grep -q 'TestFirstAudioMatrix\|firstAudioControl'; then
            echo "test-only harness symbol leaked into production binary" >&2
            exit 1
          fi

  windows-boundaries:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Windows CGO compiler
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true
          cache-dependency-path: server/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install browser-runner dependencies
        run: npm ci --prefix web --no-audit --no-fund
      - name: Test Windows private DACL and process-tree boundaries
        run: python -m unittest discover -s review -p test_first_audio_matrix_control.py -v
      - name: Confirm CGO compiler is active
        run: |
          go env CGO_ENABLED
          gcc --version
      - name: Test Go harness path and lifecycle boundaries
        working-directory: server
        run: go test ./internal/api -run '^TestFirstAudioMatrix' -count=1 -timeout=10m
