permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.14"
          cache: true
          cache-dependency-path: server/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install browser-runner dependencies
        run: npm ci --prefix web --no-audit --no-fund
      - name: Build and typecheck the web application
        working-directory: web
        run: npm run build
      - name: Discover the isolated Playwright journey
        working-directory: web
        env:
          FIRST_AUDIO_MATRIX_API_ORIGIN: http://127.0.0.1:18080
          FIRST_AUDIO_MATRIX_WEB_PORT: "18081"
          FIRST_AUDIO_MATRIX_OUTPUT_DIR: ${{ runner.temp }}/first-audio-matrix/list-output
          FIRST_AUDIO_MATRIX_REPORT: ${{ runner.temp }}/first-audio-matrix/list-report.json
          FIRST_AUDIO_MATRIX_EVIDENCE: ${{ runner.temp }}/first-audio-matrix/list-evidence.json
        run: npx playwright test --list --config=playwright.first-audio-matrix.config.ts
      - name: Test parent process boundary helpers
        run: python3 -m unittest discover -s review -p test_first_audio_matrix_control.py -v
      - name: Test JSONL parser, lifecycle, replay, and terminal cleanup
        working-directory: server
        run: go test -v ./internal/api -run '^(TestFirstAudio(Matrix|Guard(Context|Probe|Controller|Publisher|CallbackTerminal|SQLiteCallback))|TestFirstAudioLessonPrimaryKeyCardinalityRealSchema|TestFirstAudioGuardedAppPrepare(RealSQL|RejectsInvalidCapabilityBeforeOpen|NewAppStartupErrorClosesWithoutListener|NewAppPanicRollsBackAndClosesWithoutListener)|TestFirstAudioPreflightPrepare[A-Za-z0-9]*)$' -count=1 -timeout=5m
      - name: Test strict SQLite journey audit row guard
        working-directory: server
        run: go test ./internal/api -run '^TestFirstAudioJourney' -count=1 -timeout=5m
      - name: Verify reset authorizer capture manifest
        working-directory: server
        run: go test ./internal/api -run '^(TestFirstAudioReset(AuthorizerCaptureOnly|ManifestWriterRejectsSymlinkTargets)|TestFirstAudioTriggerManifestDigestIgnoresLineEndings)$' -count=1 -timeout=5m
      - name: Test classroom tool transaction outcome handling
        working-directory: server
        run: go test ./internal/api -run '^(TestToolTransaction|TestObservedToolTransaction|TestUncertainToolTransaction|TestRetiredRoomRejectsPublicProgressionEntrypoints|TestDeferredCommitFailureStopsTeacherContinuationAndSnapshot)' -count=1 -timeout=5m
      - name: Test local SQLite failed-COMMIT cleanup policy
        working-directory: server/third_party/glebarez-go-sqlite
        run: go test . -run '^TestFailedCommitCleanupError' -count=1 -timeout=1m
      - name: Race-test immutable guard context publication
        working-directory: server
        run: go test -race ./internal/api -run '^(TestFirstAudioGuard(Context|Probe|Controller|Publisher)|TestFirstAudioMatrixRealSQLRejectsLessonUpdateBeforeTokenConsumption|TestFirstAudioMatrixRealSQLRejectsOtherLessonUpdate|TestFirstAudioMatrixRealSQLRejectsZeroRowUpdate|TestFirstAudioMatrixRealSQLRejectsCorruptedExpectedProjection|TestFirstAudioLessonPrimaryKeyCardinalityRealSchema|TestFirstAudioGuardedAppPrepare(RealSQL|RejectsInvalidCapabilityBeforeOpen|NewAppStartupErrorClosesWithoutListener|NewAppPanicRollsBackAndClosesWithoutListener)|TestFirstAudioPreflightPrepare[A-Za-z0-9]*)$' -count=1 -timeout=5m
      - name: Race-test SQLite journey audit row guard
        working-directory: server
        run: go test -race ./internal/api -run '^TestFirstAudioJourneyAuditGuard' -count=1 -timeout=5m
      - name: Race-test reset authorizer capture
        working-directory: server
        run: go test -race ./internal/api -run '^(TestFirstAudioReset(AuthorizerCaptureOnly|ManifestWriterRejectsSymlinkTargets)|TestFirstAudioTriggerManifestDigestIgnoresLineEndings)$' -count=1 -timeout=5m
      - name: Confirm Linux CGO compiler is active
        run: |
          test "$(go env CGO_ENABLED)" = "1"
          gcc --version
      - name: Check Go formatting and API package vet
        working-directory: server
        run: |
          unformatted=$(gofmt -l internal/api/first_audio_matrix_*_test.go)
          if [ -n "$unformatted" ]; then
            while IFS= read -r file; do
              gofmt -d "$file"
            done <<< "$unformatted"
            printf 'gofmt required for:\n%s\n' "$unformatted" >&2
            exit 1
          fi
          go vet ./internal/api
      - name: Verify test-only harness is absent from production binary
        working-directory: server
        run: |
          go build -o "$RUNNER_TEMP/en-words-server" ./cmd/server
          if go tool nm "$RUNNER_TEMP/en-words-server" | grep -q 'TestFirstAudioMatrix\|TestFirstAudioGuardContext\|firstAudioControl\|firstAudioGuardContext'; then
            echo "test-only harness symbol leaked into production binary" >&2
            exit 1
          fi

  windows-boundaries:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Windows CGO compiler
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.14"
          cache: true
          cache-dependency-path: server/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install browser-runner dependencies
        run: npm ci --prefix web --no-audit --no-fund
      - name: Build and typecheck the web application
        working-directory: web
        run: npm.cmd run build
      - name: Discover the isolated Playwright journey
        working-directory: web
        env:
          FIRST_AUDIO_MATRIX_API_ORIGIN: http://127.0.0.1:18080
          FIRST_AUDIO_MATRIX_WEB_PORT: "18081"
          FIRST_AUDIO_MATRIX_OUTPUT_DIR: ${{ runner.temp }}/first-audio-matrix/list-output
          FIRST_AUDIO_MATRIX_REPORT: ${{ runner.temp }}/first-audio-matrix/list-report.json
          FIRST_AUDIO_MATRIX_EVIDENCE: ${{ runner.temp }}/first-audio-matrix/list-evidence.json
        run: npm.cmd exec -- playwright test --list --config=playwright.first-audio-matrix.config.ts
      - name: Test Windows private DACL and process-tree boundaries
        run: python -m unittest discover -s review -p test_first_audio_matrix_control.py -v
      - name: Confirm CGO compiler is active
        run: |
          go env CGO_ENABLED
          gcc --version
      - name: Test Go harness path and lifecycle boundaries
        working-directory: server
        run: go test ./internal/api -run '^(TestFirstAudio(Matrix|Guard(Context|Probe|Controller|Publisher|CallbackTerminal|SQLiteCallback))|TestFirstAudioLessonPrimaryKeyCardinalityRealSchema|TestFirstAudioGuardedAppPrepare(RealSQL|RejectsInvalidCapabilityBeforeOpen|NewAppStartupErrorClosesWithoutListener|NewAppPanicRollsBackAndClosesWithoutListener)|TestFirstAudioPreflightPrepare[A-Za-z0-9]*)$' -count=1 -timeout=10m
      - name: Test strict SQLite journey audit row guard
        working-directory: server
        run: go test ./internal/api -run '^TestFirstAudioJourney' -count=1 -timeout=5m
      - name: Verify reset authorizer capture manifest
        working-directory: server
        run: go test ./internal/api -run '^(TestFirstAudioReset(AuthorizerCaptureOnly|ManifestWriterRejectsSymlinkTargets)|TestFirstAudioTriggerManifestDigestIgnoresLineEndings)$' -count=1 -timeout=5m
      - name: Test classroom tool transaction outcome handling
        working-directory: server
        run: go test ./internal/api -run '^(TestToolTransaction|TestObservedToolTransaction|TestUncertainToolTransaction|TestRetiredRoomRejectsPublicProgressionEntrypoints|TestDeferredCommitFailureStopsTeacherContinuationAndSnapshot)' -count=1 -timeout=10m
      - name: Test local SQLite failed-COMMIT cleanup policy
        working-directory: server/third_party/glebarez-go-sqlite
        run: go test . -run '^TestFailedCommitCleanupError' -count=1 -timeout=2m
